[project]
name = "beanie"
version = "0.1.0"
description = "A small cafe ordering system (five services) for the Ironhack DevOps bootcamp"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501", "B018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a real PostgreSQL (set DATABASE_URL)"]

[tool.coverage.run]
source = ["beanie"]
omit = ["beanie/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
